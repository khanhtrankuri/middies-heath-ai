  - id: migraine_red_flags_vi
    query: "Đau đầu có dấu hiệu nào cần đi cấp cứu?"
    expected_keywords: ["đột ngột", "yếu liệt"]
    expected_source_ids: [reviewed-headache-red-flags]
  - id: respiratory_information_vi
    query: "Nhiễm virus đường hô hấp thường có biểu hiện gì?"
    expected_keywords: ["ho", "sốt"]
    expected_source_ids: [reviewed-respiratory-overview]
