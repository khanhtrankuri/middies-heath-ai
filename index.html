<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Middies Health AI — Trợ Lý Y Tế & Chăm Sóc Sức Khỏe Cá Nhân</title>
    <meta
      name="description"
      content="Hệ thống trợ lý y tế thông minh hỗ trợ phân tích triệu chứng khẩn cấp, đọc đơn thuốc & xét nghiệm qua ảnh, kiểm tra tương tác thuốc và quản lý hồ sơ sức khỏe cá nhân."
    />
    <meta property="og:title" content="Middies Health AI — Trợ Lý Y Tế & Chăm Sóc Sức Khỏe Cá Nhân" />
    <meta
      property="og:description"
      content="Hệ thống trợ lý y tế thông minh hỗ trợ phân tích triệu chứng khẩn cấp, đọc đơn thuốc & xét nghiệm qua ảnh, kiểm tra tương tác thuốc và quản lý hồ sơ sức khỏe cá nhân."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event &&
            ((event.filename && event.filename.indexOf('@vite/client') !== -1) ||
              (event.message && event.message.indexOf('WebSocket') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          var reasonStr = String((event && event.reason) || '');
          if (
            reasonStr.indexOf('@vite/client') !== -1 ||
            reasonStr.indexOf('WebSocket') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
