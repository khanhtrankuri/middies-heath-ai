[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meddies-health-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Meddies Health AI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3,<5",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
