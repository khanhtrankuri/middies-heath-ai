[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[project]
name = "meddies-health-ai-backend"
version = "0.3.0"
description = "FastAPI backend for Meddies Health AI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.2,<2",
  "beautifulsoup4>=4.12,<5",
  "bitsandbytes>=0.45,<1",
  "datasets>=3,<5",
  "faiss-cpu>=1.9,<2",
  "fastapi>=0.116,<1",
  "peft>=0.14,<1",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "sentence-transformers>=3.3,<6",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "trl>=0.17,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]
vllm = [
  "vllm>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
